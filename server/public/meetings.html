<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗓️ Uchrashuvlar Paneli – Sotuvchi</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a33;
      --muted: #8aa0d0;
      --text: #e8eeff;
      --accent: #7aa7ff;
      --border: rgba(255, 255, 255, 0.09);
      --success: #43d19e;
      --warning: #ffc107;
      --danger: #ff6b6b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    header {
      background: rgba(11, 18, 32, 0.8);
      backdrop-filter: blur(8px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 500;
      transition: all 0.2s ease;
      background: linear-gradient(180deg, rgba(122,167,255,0.25), rgba(122,167,255,0.1));
    }
    button:hover { background: rgba(122,167,255,0.3); }
    
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    
    .meeting-card {
      background: linear-gradient(145deg, rgba(16, 26, 51, 0.9), rgba(11, 18, 32, 0.9));
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .meeting-card:hover {
      transform: translateY(-4px);
      border-color: rgba(122, 167, 255, 0.4);
    }
    .meeting-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--accent), #b388ff);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .client-name {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: var(--text);
    }
    .client-phone {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0;
    }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 193, 7, 0.15);
      color: var(--warning);
      border: 1px solid rgba(255, 193, 7, 0.3);
    }
    .status-badge.live {
      background: rgba(67, 209, 158, 0.15);
      color: var(--success);
      border-color: rgba(67, 209, 158, 0.3);
      box-shadow: 0 0 10px rgba(67, 209, 158, 0.4);
      animation: pulseLive 2s infinite;
    }
    .status-badge.late {
      background: rgba(255, 107, 107, 0.15);
      color: var(--danger);
      border-color: rgba(255, 107, 107, 0.3);
    }
    
    @keyframes pulseLive {
      0% { box-shadow: 0 0 0 0 rgba(67, 209, 158, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(67, 209, 158, 0); }
      100% { box-shadow: 0 0 0 0 rgba(67, 209, 158, 0); }
    }
    
    .timer-container {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .timer-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .timer-value {
      font-size: 2.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 0;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .meeting-details {
      flex: 1;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .detail-row {
      display: flex;
      margin-bottom: 8px;
    }
    .detail-icon {
      margin-right: 8px;
      width: 16px;
      text-align: center;
    }
    .detail-text {
      flex: 1;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      grid-column: 1 / -1;
      background: var(--panel);
      border-radius: 16px;
      border: 1px dashed var(--border);
    }
    .empty-state h2 { color: var(--text); margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>🗓️ Sotuvchi: Uchrashuvlar Paneli</h1>
    <div style="display: flex; gap: 12px;">
      <button onclick="window.location.href='/'">Bosh sahifaga qaytish</button>
      <button id="refreshBtn" style="background: linear-gradient(180deg, rgba(67, 209, 158, 0.25), rgba(67, 209, 158, 0.1)); border-color: rgba(67, 209, 158, 0.3); color: #43d19e;">Yangilash</button>
    </div>
  </header>

  <main class="container">
    <div id="meetingsGrid" class="grid">
      <!-- Cards will be injected here via JS -->
      <div class="empty-state">
        <h2>Yuklanmoqda...</h2>
        <p>Uchrashuvlar ma'lumotlari olinmoqda.</p>
      </div>
    </div>
  </main>

  <script src="/meetings.js"></script>
</body>
</html>
